version: '3.8'

services:
  # O coração da aplicação (PHP-FPM)
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: aprepi-app
    container_name: aprepi-app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - .:/var/www
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
      - DB_CONNECTION=mysql
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=${DB_DATABASE:-aprepi_db}
      - DB_USERNAME=${DB_USERNAME:-aprepi_user}
      - DB_PASSWORD=${DB_PASSWORD:-password}
    networks:
      - aprepi-network
    depends_on:
      - db

  # Servidor Web (Nginx)
  nginx:
    image: nginx:alpine
    container_name: aprepi-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - .:/var/www
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - aprepi-network
    depends_on:
      - app

  # Base de Dados (MySQL)
  db:
    image: mysql:8.0
    container_name: aprepi-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-password}
      MYSQL_DATABASE: ${DB_DATABASE:-aprepi_db}
      MYSQL_USER: ${DB_USERNAME:-aprepi_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-password}
    volumes:
      - dbdata:/var/lib/mysql
    networks:
      - aprepi-network

# Redes para comunicação interna
networks:
  aprepi-network:
    driver: bridge

# Volumes persistentes
volumes:
  dbdata: